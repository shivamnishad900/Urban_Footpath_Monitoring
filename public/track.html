<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Track Report - UrbanFootpath</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            🚶 UrbanFootpath
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="report.html">
                Report Issue
            </a>

            <a href="track.html">
                Track Report
            </a>
            <a href="analytics.html">
                Analytics
            </a>

            <a href="admin.html">
                Admin
            </a>

        </div>

    </nav>


    <!-- Track Section -->

    <section class="track-section">

        <div class="track-container">

            <h1>Track Your Report</h1>

            <p>
                Enter your Report ID to check the
                current status of your complaint.
            </p>


            <form id="trackForm">

                <div class="form-group">

                    <label for="reportId">
                        Report ID
                    </label>

                    <input
                        type="number"
                        id="reportId"
                        placeholder="Example: 1"
                        min="1"
                        required>

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    🔎 Track Report

                </button>

            </form>


            <!-- Result -->

            <div id="trackResult"></div>

        </div>

    </section>


    <footer>

        <p>
            © 2026 Urban Footpath Monitoring
            & Management System
        </p>

        <p>
            Ideal Lab Project | Urban System – Q4
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
